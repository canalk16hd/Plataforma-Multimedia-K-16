font-weight:bold;

}

.live-dot{
width:7px;
height:7px;
background:#ff4444;
border-radius:50%;
box-shadow:0 0 8px #ff4444;

@keyframes pulse{
0%,100%{

50%{

margin-bottom:3px;

font-size:10px;
}

#nowTitle{

.player-box{
width:100%;
aspect-ratio:16/9;
background:#000;
border-radius:12px;
overflow:hidden;
}

.player-box video,
.player-box iframe{
width:100%;
height:100%;
display:block;
border:none;
}

.plyr{
width:100%;
height:100%;
}

.plyr--video{
background:#000!important;
}

.plyr__controls{
background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.2))!important;
}

.plyr__control{
color:#fff!important;
}

.plyr__control:hover{
background:var(--accent)!important;
}

.plyr__control--overlaid{
background:var(--accent)!important;
}

.plyr--full-ui input[type=range]{
color:var(--accent)!important;
}

/* FILTROS */

.filters{
display:flex;

gap:8px;
margin-bottom:18px;

.filter-btn{
padding:7px 14px;
border:none;
border-radius:20px;

color:#fff;
cursor:pointer;
transition:.2s;
font-size:12px;

.filter-btn:hover{

/* CANALES */

.canal{

cursor:pointer;

border:1px solid rgba(255,255,255,.08);

.canal:hover{

/* SISTEMA */

const playerBox=document.getElementById('playerBox');
const lista=document.getElementById('lista');
const filtersBox=document.getElementById('filters');
const nowTitle=document.getElementById('nowTitle');

let hls;
let activeDiv;
let currentCat='Todos';

/* CATEGORIAS */

function renderCategorias(){

const cats=['Todos',...new Set(canales.map(c=>c.cat))];

filtersBox.innerHTML='';

cats.forEach(cat=>{

const btn=document.createElement('button');

btn.className='filter-btn';

btn.textContent=cat;

btn.onclick=()=>{

currentCat=cat;

renderCanales();

};

filtersBox.appendChild(btn);

});

}

function renderCanales(){

lista.innerHTML='';

const filtered=currentCat==='Todos'
?canales
:canales.filter(c=>c.cat===currentCat);

filtered.forEach(c=>{

const div=document.createElement('div');

div.className='canal';

div.innerHTML=`
<img src="${c.l}">
<div class="canal-name">${c.n}</div>
`;

div.onclick=()=>{

if(activeDiv){
activeDiv.classList.remove('activo');
}

div.classList.add('activo');

activeDiv=div;

nowTitle.textContent=c.n;

play(c.u);

};

lista.appendChild(div);

});

}

/* PLAYER */

function play(url){

if(hls){
hls.destroy();
hls=null;
}

playerBox.innerHTML='';

if(url.includes('.m3u8')){

const video=document.createElement('video');

video.controls=true;
video.autoplay=true;
video.playsInline=true;

playerBox.appendChild(video);

new Plyr(video,{
controls:[
'play-large',
'play',
'progress',
'current-time',
'mute',
'volume',
'settings',
'pip',
'fullscreen'
]
});

if(Hls.isSupported()){

hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

}else{

video.src=url;

}

}else if(url.includes('.mp4')){

const video=document.createElement('video');

video.src=url;

video.controls=true;

playerBox.appendChild(video);

new Plyr(video);

}else{

playerBox.innerHTML=`
<iframe
src="${url}"
allowfullscreen
allow="autoplay">
</iframe>
`;

}

}

renderCategorias();

renderCanales();

setTimeout(()=>{

const first=document.querySelector('.canal');

if(first){
first.click();
}

},500);
